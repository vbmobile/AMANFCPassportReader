image: macos-sequoia

stages:
  - test

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

ios_tests:
  stage: test
  tags:
    - macos-arm64
  script:
    - bash scripts/test-ios.sh
  artifacts:
    when: always
    paths:
      - reports/
    expire_in: 1 week
